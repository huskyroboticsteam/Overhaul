name: Render Excalidraw Diagrams

# Renders every .excalidraw file to an .svg next to it so diagrams can be viewed on GitHub
on:
  push:
    paths:
      - "**.excalidraw"
      - ".github/scripts/excalidraw/**"
      - ".github/workflows/excalidraw.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

# A newer push re-renders everything, so drop any run still in progress for the same branch
concurrency:
  group: excalidraw-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install renderer
        working-directory: .github/scripts/excalidraw
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npx playwright install --with-deps --only-shell chromium

      - name: Render diagrams
        run: git ls-files -z '*.excalidraw' | xargs -0 --no-run-if-empty node .github/scripts/excalidraw/export.mjs

      # Commits made with GITHUB_TOKEN don't trigger workflows, so this can't loop
      - name: Commit rendered SVGs
        run: |
          git ls-files -z '*.excalidraw' | sed -z 's/\.excalidraw$/.svg/' | xargs -0 --no-run-if-empty git add --
          if git diff --cached --quiet; then
            echo "Diagrams are up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Render Excalidraw diagrams [skip ci]"
          git push
