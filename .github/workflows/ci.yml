name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Build Docker
      run: |
        cd ${{ github.workspace }}
        sudo apt-get update && \
             apt-get docker.io
        cd .devcontainer
        sudo docker build . -t overhaul-img
        
    - name: Build
      run: |
        sudo docker run -it --mount source=~/Overhaul,target=/home/ws,type=bind overhaul-img
        colcon test --ctest-args -LE linter --event-handlers console_direct+ && colcon test-result --verbose
